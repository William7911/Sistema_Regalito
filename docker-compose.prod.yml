services:
  db:
    image: postgres:15-alpine
    container_name: ${PROD_CONTAINER_PREFIX:-regalito}_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-regalito_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Regalito_2026}
      POSTGRES_DB: ${DB_NAME:-regalito_pos}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-regalito_admin} -d ${DB_NAME:-regalito_pos}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - regalito_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PROD_CONTAINER_PREFIX:-regalito}_backend_prod
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-regalito_admin}:${DB_PASSWORD:-Regalito_2026}@db:5432/${DB_NAME:-regalito_pos}
      - ENVIRONMENT=production
    depends_on:
      db:
        condition: service_healthy
    networks:
      - regalito_net

  frontend_nginx:
    image: nginx:alpine
    container_name: ${PROD_CONTAINER_PREFIX:-regalito}_frontend_prod
    restart: always
    ports:
      - "${WEB_PORT:-9090}:80"
    volumes:
      # Montar la carpeta del frontend
      - ./frontend:/usr/share/nginx/html:ro
      # Montar la configuración de Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - regalito_net

volumes:
  pgdata_prod:
    name: ${PGDATA_VOLUME:-regalito_pgdata_prod}

networks:
  regalito_net:
    name: ${NETWORK_NAME:-regalito_network}
    driver: bridge
